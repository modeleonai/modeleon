[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "modeleon"
version = "0.1.1"
description = "Financial Model Engineering — Python code compiles to live Excel formulas"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Modeleon", email = "admin@modeleon.ai"}]
readme = "README.md"
keywords = ["financial-modeling", "excel", "python", "formulas"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://modeleon.ai"
Repository = "https://github.com/modeleonai/modeleon"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.entry-points."modeleon.plugins"]
# Pro registers here: pro = "modeleon_pro.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/modeleon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
